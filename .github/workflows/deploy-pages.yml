name: Deploy NEWRO to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Prepare static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify NEWRO entrypoint
        run: |
          test -s docs/index.html
          grep -qi '<html' docs/index.html
          grep -qi '<script' docs/index.html
      - name: Smoke-test static app
        run: |
          node --check docs/assets/newro-experience.js
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert');
          const html = fs.readFileSync('docs/index.html', 'utf8');
          assert(html.includes('NEWROHome'), 'NEWRO landing adapter missing');
          assert(html.includes('newro-experience.css'), 'Design stylesheet missing');
          assert(html.includes('newro-experience.js'), 'Experience script missing');
          const inline = Array.from(html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)).map(m => m[1]);
          inline.forEach(src => new Function(src));
          ['docs/index.html', 'docs/assets/newro-experience.js', 'docs/assets/newro-experience.css', 'docs/manifest.webmanifest', 'docs/sw.js'].forEach(f => assert(fs.statSync(f).size > 0, f + ' is empty'));
          console.log('NEWRO markup and JavaScript syntax validated');
          NODE
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    name: Publish NEWRO
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
