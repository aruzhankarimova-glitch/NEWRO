name: Deploy NEWRO to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Prepare static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify NEWRO entrypoint
        run: |
          test -s docs/index.html
          grep -qi '<html' docs/index.html
          grep -qi '<script' docs/index.html
      - name: Smoke-test static app
        run: |
          node --check docs/assets/newro-experience.js
          node --check docs/assets/newro-swarm.js
          node --check docs/assets/newro-course.js
          node --check docs/assets/newro-flow.js
          node --check docs/assets/newro-mobile.js
          node --check docs/assets/newro-premium.js
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert');
          const html = fs.readFileSync('docs/index.html', 'utf8');
          assert(html.includes('NEWROHome'), 'NEWRO landing adapter missing');
          assert(html.includes('newro-experience.css'), 'Design stylesheet missing');
          assert(html.includes('newro-experience.js'), 'Experience script missing');
          assert(html.includes('newro-swarm.js'), 'Mobile swarm script missing');
          assert(html.includes('newro-course.css'), 'Course design CSS missing');
          assert(html.includes('newro-course.js'), 'Course UI JS missing');
          assert(html.includes('newro-flow.js'), 'End-to-end flow JS missing');
          assert(html.includes('newro-flow.css'), 'End-to-end flow CSS missing');
          assert(html.includes('newro-mobile.js'), 'Phone interactions missing');
          assert(html.includes('newro-polish.css'), 'Anti-slop design refinements missing');
          assert(html.includes('newro-premium.css'), 'Premium UI CSS missing');
          assert(html.includes('newro-premium.js'), 'Interactive UI JS missing');
          assert(html.includes('newro-responsive.css'), 'Responsive accessibility CSS missing');
          assert(html.includes('application/ld+json'), 'Structured product description missing');
          const inline = Array.from(html.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/g)).filter(m => !m[1].includes('application/ld+json')).map(m => m[2]);
          inline.forEach(src => new Function(src));
          ['docs/index.html', 'docs/assets/newro-experience.js', 'docs/assets/newro-swarm.js', 'docs/assets/newro-course.js', 'docs/assets/newro-course.css', 'docs/assets/newro-flow.js', 'docs/assets/newro-flow.css', 'docs/assets/newro-mobile.js', 'docs/assets/newro-polish.css', 'docs/assets/newro-premium.js', 'docs/assets/newro-premium.css', 'docs/assets/newro-responsive.css', 'docs/assets/illustrations/marketing-illustration.svg', 'docs/assets/illustrations/product-illustration.svg', 'docs/assets/illustrations/mentor-illustration.svg', 'docs/assets/newro-experience.css', 'docs/manifest.webmanifest', 'docs/sw.js'].forEach(f => assert(fs.statSync(f).size > 0, f + ' is empty'));
          assert(!fs.existsSync('docs/evaluation.json') && !fs.existsSync('docs/EVALUATION_EVIDENCE.md') && !fs.existsSync('docs/HACKATHON_AUDIT.md'), 'Internal audit instructions must not be published');
          console.log('NEWRO markup and JavaScript syntax validated');
          NODE
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    name: Publish NEWRO
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
