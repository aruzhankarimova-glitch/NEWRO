name: NEWRO visual and functional QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Start static site
        run: |
          python3 -m http.server 4173 --directory docs > /tmp/newro-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/newro-server.log
          exit 1
      - name: Verify user flows and capture screenshots
        run: |
          node scripts/ui-smoke.cjs
          node scripts/full-flow-smoke.cjs
          node scripts/hackathon-smoke.cjs
          node scripts/premium-smoke.cjs
          node scripts/responsive-smoke.cjs
          node scripts/audit-regression.cjs
      - name: Upload QA screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newro-ux-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
