*{box-sizing:border-box}body{margin:0;min-width:320px}button,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.47;cursor:not-allowed}button:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}a{color:var(--accent)}.site{max-width:1080px;margin:auto;padding:0 22px}.top{height:72px;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-size:24px;font-weight:800;letter-spacing:-.06em}.logo em{background:var(--accent);color:#fff;border-radius:10px;font-size:19px;font-style:normal;padding:5px 11px;margin-right:8px}.kicker{font-weight:700;font-size:13px;color:var(--muted)}.hero{padding:85px 0 90px}.hero h1{font-size:clamp(39px,7vw,78px);letter-spacing:-.072em;line-height:1.03;max-width:920px;margin:0 0 25px}.hero p{font-size:20px;line-height:1.5;max-width:640px;color:var(--text);margin:0 0 38px}.eyebrow{color:var(--accent)!important;font-size:14px!important;font-weight:700;margin-bottom:20px!important}.roles{display:grid;grid-template-columns:1fr 1fr;gap:18px}.role{border:1px solid var(--line);background:#fff;border-radius:20px;padding:29px;text-align:left;min-height:258px;transition:transform .18s,border-color .18s}.role:hover{border-color:var(--accent);transform:translateY(-2px)}.role h2{font-size:27px;letter-spacing:-.04em;margin:21px 0 8px}.role p{font-size:16px;line-height:1.55;margin:0;color:var(--text)}.role .go{display:block;color:var(--accent);font-weight:700;margin-top:22px}.square{display:grid;place-items:center;border-radius:13px;background:var(--surface);color:var(--accent);height:48px;width:48px;font-size:24px}.foot{border-top:1px solid var(--line);color:var(--muted);font-size:12px;padding:18px 0 25px}.mini{font-size:13px;line-height:1.5;color:var(--muted)}.player{min-height:100dvh;display:flex;flex-direction:column}.playerHeader{position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line);background:#fffffff0;backdrop-filter:blur(8px)}.headerInner{height:69px;max-width:640px;margin:auto;padding:0 18px;display:flex;gap:13px;align-items:center}.plainBtn{background:transparent;border:0;width:44px;height:44px;border-radius:12px;color:var(--ink);font-size:22px}.plainBtn:hover{background:var(--surface)}.track{height:9px;background:#e9e6fc;border-radius:20px;overflow:hidden;flex:1}.fill{height:100%;background:var(--accent);border-radius:20px;transition:width .25s}.playerMain{flex:1;max-width:640px;padding:31px 20px 65px;width:100%;margin:0 auto}.player h1{font-size:clamp(30px,5vw,39px);letter-spacing:-.048em;line-height:1.12;margin:0 0 13px}.lead{font-size:17px;line-height:1.57;color:var(--text);margin:0 0 21px}.step{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 13px}.panel{background:var(--surface);padding:20px;border-radius:17px;margin:15px 0}.panel h3{font-size:17px;margin:0 0 8px}.panel p{font-size:16px;line-height:1.58;margin:0;color:var(--text)}.cards{display:grid;gap:12px;margin:19px 0}.choice{display:flex;align-items:flex-start;gap:13px;width:100%;background:white;border:2px solid var(--line);border-radius:15px;padding:18px 16px;color:var(--ink);text-align:left;min-height:65px;line-height:1.4}.choice[aria-pressed="true"]{border-color:var(--accent);background:#f7f5ff}.choice:hover{border-color:#bcb6ea}.dot{border:2px solid #a8a1bc;border-radius:50%;width:20px;height:20px;flex-shrink:0;margin-top:1px;display:grid;place-items:center;font-size:11px}.choice[aria-pressed="true"] .dot{border-color:var(--accent);color:#fff;background:var(--accent)}.choice strong{display:block}.choice small{display:block;font-size:13px;color:var(--muted);margin-top:5px}.field{display:block;font-weight:700;font-size:14px;margin:21px 0 9px}.input{width:100%;padding:15px;border:1.5px solid #bcb6d5;border-radius:14px;background:white;min-height:96px;line-height:1.55;color:var(--ink);resize:vertical}.input:focus{border-color:var(--accent)}.mentor{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:16px;padding:18px;margin:22px 0}.avatar{width:34px;height:34px;border-radius:10px;background:#e0dbfc;display:grid;place-items:center;color:var(--accent);font-weight:800;flex-shrink:0}.mentor b{font-size:13px}.mentor p{font-size:15px;color:var(--text);line-height:1.55;margin:5px 0 0}.info{border:1px solid var(--line);border-radius:16px;padding:18px 19px;margin:11px 0}.info b{display:block}.info p{color:var(--text);line-height:1.55;margin:7px 0 0}.chip{display:inline-block;font-size:12px;font-weight:700;background:var(--surface);color:var(--accent);border-radius:25px;padding:6px 11px}.green{color:var(--good)}.red{color:var(--danger)}.summary{border:1px solid var(--line);border-radius:18px;padding:22px;margin:13px 0}.summary h3{margin:13px 0;font-size:24px;letter-spacing:-.04em}.summary dt{font-size:12px;font-weight:700;color:var(--muted);margin-top:16px}.summary dd{line-height:1.5;margin:5px 0 0;overflow-wrap:anywhere}.buttons{display:flex;gap:10px}.buttons>*{flex:1}.primary,.secondary{min-height:54px;border-radius:14px;font-size:16px;font-weight:750;padding:13px 20px;border:0}.primary{background:var(--cta);color:white;flex:1}.primary:hover:not(:disabled){background:#136b33}.secondary{background:var(--surface);color:var(--accent)}.playerFooter{position:sticky;bottom:0;z-index:10;border-top:1px solid var(--line);background:#fffffff0;backdrop-filter:blur(8px)}.footerInner{max-width:640px;margin:auto;padding:13px 20px max(14px,env(safe-area-inset-bottom))}.meter{background:var(--surface);border-radius:13px;padding:14px;font-size:15px}.meter .track{margin-top:10px}.note{font-size:12px;color:var(--muted);line-height:1.5;margin:14px 0}.sr{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}.same{display:flex;justify-content:space-between;gap:12px;align-items:center}@media(max-width:620px){.hero{padding:44px 0 65px}.roles{grid-template-columns:1fr}.role{min-height:auto}.hero p{font-size:18px}.buttons{flex-wrap:wrap}.footerInner>.buttons>.primary{flex:2}.playerMain{padding-top:25px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style><link rel="stylesheet" href="./assets/newro-experience.css"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="./icon.svg"></head><body><div id="app"></div><script src="./assets/newro-experience.js"></script><script>
(function(){'use strict';
var root=document.getElementById('app'),key='newro-career-tryout-v1';
var features=[{id:'login',title:'Fix the iOS login crash',hours:4,value:'Critical',risk:'Low',detail:'1 in 7 sign-ins fails after an update.'},{id:'reminders',title:'Renewal reminders',hours:8,value:'High',risk:'Medium',detail:'The most requested core feature.'},{id:'onboarding',title:'New onboarding checklist',hours:12,value:'High',risk:'High',detail:'Changes an untested signup flow.'},{id:'household',title:'Shared household plans',hours:16,value:'Medium',risk:'High',detail:'Permissions design is unfinished.'},{id:'dark',title:'Dark mode',hours:10,value:'Medium',risk:'Low',detail:'Nice to have; not urgent.'},{id:'csv',title:'CSV export',hours:6,value:'Low',risk:'Low',detail:'Useful to some power users.'},{id:'referral',title:'Referral banner',hours:3,value:'Low',risk:'Low',detail:'Marketing request for Monday.'}];
var data={role:'',step:0,marketing:{},pm:{selection:[],answers:{}}};
try{var old=JSON.parse(localStorage.getItem(key));if(old&&typeof old==='object'){data=Object.assign(data,old);data.marketing=data.marketing||{};data.pm=data.pm||{selection:[],answers:{}};data.pm.selection=data.pm.selection||[];data.pm.answers=data.pm.answers||{}}}catch(e){}
function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function coach(s){return '<aside class="mentor"><div class="avatar" aria-hidden="true">N</div><div><b>NEWRO mentor · guided feedback</b><p>'+s+'</p></div></aside>'}
function option(group,id,name,desc,chosen){var active=chosen===id;return '<button class="choice" type="button" aria-pressed="'+active+'" onclick="NEWRO.choose(\''+group+'\',\''+id+'\')"><span class="dot">'+(active?'✓':'')+'</span><span><strong>'+esc(name)+'</strong>'+(desc?'<small>'+esc(desc)+'</small>':'')+'</span></button>'}
function textarea(field,value,hint){return '<textarea class="input" id="field-'+field+'" oninput="NEWRO.write(\''+field+'\',this.value)" placeholder="'+esc(hint)+'">'+esc(value||'')+'</textarea>'}
function summary(name,rows){return '<div class="summary"><span class="chip">Fictional practice task</span><h3>'+esc(name)+'</h3><dl>'+rows.map(function(r){return '<dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd>'}).join('')+'</dl></div><div class="buttons"><button class="secondary" type="button" onclick="NEWRO.copy()">Copy result</button><button class="secondary" type="button" onclick="NEWRO.download()">Download .txt</button></div><p class="note" role="status" id="status">A practice artifact, not a certificate or a career suitability score.</p>'}
function hours(){return features.filter(function(f){return data.pm.selection.indexOf(f.id)!==-1}).reduce(function(a,b){return a+b.hours},0)}
function can(){var a=data.marketing,b=data.pm;if(data.role==='marketing'){switch(data.step){case 2:return !!a.evidence;case 3:return !!a.audience;case 4:return !!a.claim;case 5:return !!(a.tone&&a.prompt&&a.prompt.trim().length>12);case 6:return !!(a.draft&&a.headline&&a.headline.trim().length>8);case 7:return !!(a.channel&&a.metric);case 8:return !!(a.reason&&a.reason.trim().length>10);default:return true}}if(data.role==='pm'){switch(data.step){case 2:return b.selection.length>0&&hours()<=24;case 4:return !!(b.answers.a&&b.answers.b&&b.answers.c);case 5:return !!(b.reason&&b.reason.trim().length>10);default:return true}}return true}
function marketing(){var s=data.marketing,n=data.step,title='',sub='',body='',cta='Continue';switch(n){
case 0:title='Your first day in AI marketing.';sub='Try the decisions behind a small marketing campaign. You lead the work; the mentor gives feedback.';body='<div class="panel"><h3>Your mission</h3><p>Find the right audience, write an honest message, and decide how to test it for Harbor.</p></div>'+coach('I will challenge your thinking, not choose everything for you.');cta='Open the brief';break;
case 1:title='Meet your client, Harbor';sub='Harbor shows upcoming subscription renewals. The team needs an effective campaign, but has little evidence.';body='<div class="info"><b>The assignment</b><p>Choose a customer group, create a message and design a seven-day test. The illustrative test budget is $600.</p></div><div class="panel"><h3>One constraint</h3><p>Do not promise that Harbor can stop every subscription charge.</p></div>'+coach('Harbor and the customer quotes are fictional examples.');cta='Review customer notes';break;
case 2:title='Find the strongest signal';sub='Three fictional notes arrived from customers. Which problem does Harbor solve today?';body='<div class="cards">'+option('evidence','trial','I forget when free trials become paid.','Customer note #1',s.evidence)+option('evidence','invest','I track my investments on spreadsheets.','Customer note #2',s.evidence)+option('evidence','student','I want cheaper streaming subscriptions.','Customer note #3',s.evidence)+'</div>'+(s.evidence?coach(s.evidence==='trial'?'This problem fits Harbor’s existing renewal reminder feature.':'That is a need, but is it something Harbor can solve today? You can change your decision.'):coach('Find the note that matches the actual product.'));cta='Use this signal';break;
case 3:title='Who should we reach first?';sub='A strong campaign starts with a specific audience. Choose your first group.';body='<div class="cards">'+option('audience','trials','People managing free trials','They risk surprise renewals',s.audience)+option('audience','investors','Advanced individual investors','They need portfolio analysis',s.audience)+option('audience','students','Students searching for discounts','They value lower subscription prices',s.audience)+'</div>'+coach('Choose based on the evidence, not the biggest imaginable market.');cta='Choose the message';break;
case 4:title='Make a promise you can defend';sub='Which headline is specific and supported by what the product can actually do?';body='<div class="cards">'+option('claim','hype','The world’s smartest AI finance platform.','No proof or relevant detail',s.claim)+option('claim','honest','See upcoming renewals before you are charged.','Specific and verifiable',s.claim)+option('claim','impossible','Never pay for a subscription again.','An impossible guarantee',s.claim)+'</div>'+(s.claim?coach(s.claim==='honest'?'This sounds credible because it describes a real feature.':'Check the claim: could Harbor prove those words? Try again if not.'):coach('Clear language beats impressive-sounding language.'));cta='Give AI a brief';break;
case 5:title='Direct your AI teammate';sub='Strong output starts with an audience, a task and clear guardrails.';body='<label class="field">Tone</label><div class="cards">'+option('tone','calm','Calm and practical','Simple language',s.tone)+option('tone','playful','Playful','Light but not misleading',s.tone)+option('tone','urgent','Urgent','Time-sensitive, never deceptive',s.tone)+'</div><label class="field" for="field-prompt">Prompt for your AI teammate</label>'+textarea('prompt',s.prompt||'','Write two headlines for the selected audience. Describe the renewal reminder feature. Avoid unsupported guarantees.')+coach('This prototype displays prepared sample outputs, not text from a live language model.');cta='Review sample AI output';break;
case 6:title='Edit the AI draft';sub='Choose a sample draft. Then rewrite it so the promise is clear and truthful.';body='<div class="cards">'+option('draft','vague','Revolutionize your financial life with AI.','Overclaims the value',s.draft)+option('draft','clear','Know what renews next.','Short and useful',s.draft)+'</div><label class="field" for="field-headline">Your final headline</label>'+textarea('headline',s.headline||'','Write an honest, specific headline')+coach('Do not ship a draft just because it was generated. You own the decision.');cta='Plan a test';break;
case 7:title='Design a small experiment';sub='Choose where to reach people and how to tell whether the campaign helped.';body='<label class="field">Channel</label><div class="cards">'+option('channel','paid','Small paid social test','Reaches a defined audience',s.channel)+option('channel','email','Permission-based email list','More targeted',s.channel)+option('channel','organic','Organic social post','Cheaper, less predictable',s.channel)+'</div><label class="field">Primary metric</label><div class="cards">'+option('metric','signups','Landing-page signup rate','Tracks a meaningful action',s.metric)+option('metric','likes','Likes','Engagement, not intent',s.metric)+option('metric','reach','Reach','Visibility, not conversion',s.metric)+'</div>'+coach('Choose a measurement that tests the campaign hypothesis.');cta='Defend my choice';break;
case 8:title='A question from your mentor';sub='A strong marketer can explain or revise a plan.';var ask=s.claim!=='honest'?'Some words in your message may promise too much. How would you fix that?':s.audience!=='trials'?'How does this audience connect to Harbor’s current feature?':s.metric!=='signups'?'Likes may rise without any signups. What does that mean for your test?':'People click your ad but do not sign up. What would you investigate?';body=coach(esc(ask))+'<label class="field" for="field-reason">Your response</label>'+textarea('reason',s.reason||'','Explain what you would do and why…');cta='See my feedback';break;
case 9:title='Here is what your decisions show';sub='Feedback on this exercise, not a prediction about your future career.';var f=[['Understanding customers',s.evidence==='trial'],['Choosing a suitable audience',s.audience==='trials'],['Truthful messaging',s.claim==='honest'&&!/never|guarantee|world.s best|revolutionary/i.test(s.headline||'')],['Giving AI constraints',/avoid|do not|never|without|no guarantees/i.test(s.prompt||'')],['Measuring outcomes',s.metric==='signups']];body=f.map(function(row){return '<div class="info same"><b>'+row[0]+'</b><span class="chip '+(row[1]?'green':'')+'">'+(row[1]?'Demonstrated':'Developing')+'</span></div>'}).join('')+coach('You can improve a decision and learn from it. A short exercise does not measure professional aptitude.');cta='See my work sample';break;
case 10:title='You completed the assignment';sub='Keep the small campaign brief you made. This is your first work sample.';body=summary('Harbor campaign brief',[['Audience',({trials:'Free-trial users',investors:'Individual investors',students:'Discount-seeking students'})[s.audience]||'Not chosen'],['Headline',s.headline||'Not entered'],['Channel',s.channel||'Not chosen'],['Success metric',s.metric||'Not chosen'],['Reasoning',s.reason||'Not entered']]);cta='Try another career';break;
}screen(title,sub,body,cta,10)}
function pm(){var s=data.pm,n=data.step,title='',sub='',body='',cta='Continue',count=hours(),picked=features.filter(function(f){return s.selection.indexOf(f.id)!==-1});switch(n){
case 0:title='Your first day as a Product Manager';sub='It is Wednesday. You need to make the Friday release call.';body='<div class="panel"><h3>Your assignment</h3><p>Seven feature requests. Two engineers. Only 24 hours left. You decide what ships.</p></div>'+coach('Product management is the art of making trade-offs with limited time.');cta='Open the release brief';break;
case 1:title='The Friday release';sub='Harbor is a fictional app for subscription reminders. Some users cannot sign in and the team wants to add new features.';body='<div class="info"><b>Customer signal</b><p>Support tickets have tripled since Tuesday’s update. Renewal reminders are the highest-requested feature.</p></div><div class="info"><b>Constraints</b><p>You have 24 engineering hours; everything else waits two weeks. Consider value, delivery time and risk.</p></div>';cta='Choose what ships';break;
case 2:title='Pick the Friday release';sub='Select work that fits 24 hours. The best answer balances customer impact and release risk.';body='<div class="meter"><strong class="'+(count>24?'red':'')+'">'+count+' / 24 hours chosen</strong><div class="track"><div class="fill" style="width:'+Math.min(100,Math.round(count/24*100))+'%;background:'+(count>24?'var(--danger)':'var(--accent)')+'"></div></div>'+(count>24?'<p class="red">Over capacity. Hold something to continue.</p>':'')+'</div><div class="cards">'+features.map(function(f){return option('feature',f.id,f.title+' · '+f.hours+' hours',f.value+' value · '+f.risk+' risk. '+f.detail,s.selection.indexOf(f.id)!==-1?f.id:'')}).join('')+'</div>';cta='Review my trade-offs';break;
case 3:title='Every release makes trade-offs';sub='Here is the impact of your selection, based on the exercise rules.';body='<div class="info"><b>Capacity</b><p>'+count+' hours selected. '+(count<=20?'You kept some time for unexpected work.':'You have very little buffer.')+'</p></div><div class="info"><b>Customers blocked by login</b><p>'+(s.selection.indexOf('login')!==-1?'You prioritized fixing a login crash for affected customers.':'The iOS login crash will remain unresolved.')+'</p></div><div class="info"><b>Core customer value</b><p>'+(s.selection.indexOf('reminders')!==-1?'You included renewal reminders, the most requested feature.':'You postponed renewal reminders.')+'</p></div>'+coach('You cannot ship every idea. Be able to explain what matters and what waits.');cta='Practice PM reasoning';break;
case 4:title='Three decisions to test';sub='For each example, choose the most relevant factor.';body='<label class="field">Why prioritize the login fix?</label><div class="cards">'+option('a','value','Value','Blocked customers need access',s.answers.a)+option('a','risk','Risk','Any change can break things',s.answers.a)+option('a','time','Time','Every hour matters',s.answers.a)+'</div><label class="field">Why hold shared household plans?</label><div class="cards">'+option('b','value','Value','Everyone needs this',s.answers.b)+option('b','risk','Risk','The permissions model is not ready',s.answers.b)+option('b','time','Time','Only its duration matters',s.answers.b)+'</div><label class="field">Why might CSV export wait?</label><div class="cards">'+option('c','value','Value','This is a top need',s.answers.c)+option('c','risk','Risk','Export is inherently dangerous',s.answers.c)+option('c','time','Time','Those hours may deliver more customer value elsewhere',s.answers.c)+'</div>';cta='Reflect on my decisions';break;
case 5:title='Explain your release plan';sub='A product manager communicates the reasons behind the choices.';var right=Number(s.answers.a==='value')+Number(s.answers.b==='risk')+Number(s.answers.c==='time');body='<div class="panel"><h3>'+right+' of 3 reasoning checks matched the examples</h3><p>You can go back to try again. The score describes answers to this exercise only.</p></div><label class="field" for="field-pmreason">Why did you choose these tasks?</label>'+textarea('pmreason',s.reason||'','I prioritized the login crash because…');cta='Create my decision card';break;
case 6:title='Your first PM decision card';sub='You made a release decision and defended your reasoning.';body=summary('Harbor Friday release',[['Ship Friday',picked.map(function(f){return f.title}).join(', ')||'Nothing'],['Hold',features.filter(function(f){return s.selection.indexOf(f.id)===-1}).map(function(f){return f.title}).join(', ')||'Nothing'],['Hours',count+' / 24'],['Reasoning',s.reason||'Not entered']]);cta='Try another career';break;
}screen(title,sub,body,cta,6)}
function screen(title,sub,body,cta,max){var progress=Math.round(data.step/max*100);root.innerHTML='<div class="player"><header class="playerHeader"><div class="headerInner"><button class="plainBtn" onclick="NEWRO.exit()" aria-label="Exit to careers (progress is saved)">×</button><div class="track" role="progressbar" aria-label="Task progress" aria-valuemin="0" aria-valuemax="'+max+'" aria-valuenow="'+data.step+'"><div class="fill" style="width:'+progress+'%"></div></div><span class="mini">'+(data.step+1)+'/'+(max+1)+'</span></div></header><main class="playerMain"><p class="step">'+(data.role==='marketing'?'AI Marketing Specialist':'Product Manager')+' · career try-out</p><h1 tabindex="-1" id="screenTitle">'+title+'</h1><p class="lead">'+sub+'</p>'+body+'</main><footer class="playerFooter"><div class="footerInner"><div class="buttons">'+(data.step?'<button class="secondary" type="button" onclick="NEWRO.back()">Back</button>':'')+'<button type="button" class="primary" id="next" '+(can()?'':'disabled')+' onclick="NEWRO.next()">'+cta+'</button></div><p class="note" style="text-align:center;margin:8px 0 0">Progress is saved in this browser · No signup required</p></div></footer></div>';window.scrollTo(0,0);var heading=document.getElementById('screenTitle');if(heading)heading.focus({preventScroll:true})}
function home(){if(window.NEWROHome){window.NEWROHome({resume:!!data.role,role:data.role},root);return}root.innerHTML='<div class="site"><header class="top"><span class="logo"><em>N</em> newro</span><span class="kicker">Career try-outs</span></header><main class="hero"><p class="eyebrow">TRY THE WORK, NOT JUST THE COURSE</p><h1>Find out what the job actually feels like.</h1><p>Make decisions, work through realistic challenges, and leave with a sample of your work. Free, no signup required.</p><div class="roles"><button class="role" onclick="NEWRO.start(\'marketing\')"><span class="square">✳</span><h2>AI Marketing Specialist</h2><p>Find an audience, improve AI copy and plan a test.</p><span class="go">Try the role →</span></button><button class="role" onclick="NEWRO.start(\'pm\')"><span class="square">▤</span><h2>Product Manager</h2><p>Choose what ships Friday with only 24 engineering hours.</p><span class="go">Try the role →</span></button></div>'+(data.role?'<div class="info" style="margin-top:20px"><b>Saved session</b><p>Your previous try-out is still available.</p><button class="secondary" type="button" onclick="NEWRO.resume()" style="margin-top:12px">Resume previous session</button></div>':'')+'<p class="mini" style="margin-top:27px">Harbor and its customer data are fictional. Mentor responses are rule-based feedback, not a live AI model. These exercises cannot determine career fit.</p></main><footer class="foot">NEWRO MVP · Learn by doing. No payments or accounts in this prototype.</footer></div>'}
function render(){save();if(!data.role){home();return}if(data.role==='marketing')marketing();else pm()}
function exportText(){if(data.role==='marketing'){var s=data.marketing;return 'NEWRO · AI Marketing Specialist — fictional practice brief\nAudience: '+(s.audience||'')+'\nHeadline: '+(s.headline||'')+'\nChannel: '+(s.channel||'')+'\nSuccess metric: '+(s.metric||'')+'\nReasoning: '+(s.reason||'')+'\n\nNot a certificate.'}var p=data.pm;return 'NEWRO · Product Manager — fictional practice brief\nShip: '+features.filter(function(f){return p.selection.indexOf(f.id)!==-1}).map(function(f){return f.title}).join(', ')+'\nHold: '+features.filter(function(f){return p.selection.indexOf(f.id)===-1}).map(function(f){return f.title}).join(', ')+'\nHours: '+hours()+'/24\nReasoning: '+(p.reason||'')+'\n\nNot a certificate.'}
window.NEWRO={
 start:function(role){data.role=role;data.step=0;data[role]=role==='marketing'?{}:{selection:[],answers:{}};render()},
 exit:function(){root.innerHTML='<div class="site"><header class="top"><span class="logo"><em>N</em> newro</span></header><main class="hero"><h1>Progress saved.</h1><p>You can continue this try-out on this device, or choose another role.</p><div class="buttons"><button class="primary" onclick="NEWRO.resume()">Resume session</button><button class="secondary" onclick="NEWRO.leave()">Browse careers</button></div></main></div>'},
 leave:function(){home()},
 resume:function(){render()},
 back:function(){data.step=Math.max(0,data.step-1);render()},
 next:function(){if(!can())return;var max=data.role==='marketing'?10:6;if(data.step>=max){data.role='';data.step=0;render();return}data.step++;render()},
 choose:function(group,id){var s=data[data.role];if(group==='feature'){s.selection=s.selection.indexOf(id)===-1?s.selection.concat([id]):s.selection.filter(function(x){return x!==id})}else if(['a','b','c'].indexOf(group)!==-1&&data.role==='pm'){s.answers[group]=id}else{s[group]=id;if(group==='tone'){s.prompt='Write two headlines for the selected audience in a '+id+' tone. Highlight renewal visibility. Avoid guarantees and unverified AI claims.'}if(group==='draft')s.headline=id==='clear'?'Know what renews next.':'Revolutionize your financial life with AI.'}render()},
 write:function(field,value){var name=field==='pmreason'?'reason':field;data[data.role][name]=value;save();var button=document.getElementById('next');if(button)button.disabled=!can()},
 copy:function(){var status=document.getElementById('status');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(exportText()).then(function(){if(status)status.textContent='Copied to clipboard.'}).catch(function(){if(status)status.textContent='Copy unavailable. Please use Download.'})}else if(status)status.textContent='Clipboard unavailable. Please use Download.'},
 download:function(){var blob=new Blob([exportText()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='newro-'+data.role+'-work-sample.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000)}
};render();
})();
</script><script>if('serviceWorker' in navigator && location.protocol==='https:'){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})})}</script></body></html>
